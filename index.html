<meta name="theme-color" content="#000000">
<style>
  :root{
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --glass:rgba(255,255,255,0.08);
    --glass-strong:rgba(255,255,255,0.14); --stroke:rgba(255,255,255,0.08); --stroke-strong:rgba(255,255,255,0.16);
    --label:#F5F5F7; --label2:rgba(235,235,245,0.6); --label3:rgba(235,235,245,0.3);
    --accent:#FF9F0A; --red:#FF453A;
    --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; background:var(--bg); color:var(--label); font-family:var(--font); overflow:hidden;}
  #app{max-width:480px; margin:0 auto; height:100%; position:relative; display:flex; flex-direction:column; background:var(--bg);}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{transform:translateY(40px); opacity:0}to{transform:translateY(0); opacity:1}}
  @keyframes fadeInUp{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:translateY(0)}}
  @keyframes popIn{from{transform:scale(0.9); opacity:0}to{transform:scale(1); opacity:1}}
  @keyframes wave{0%,100%{transform:scaleY(0.35)}50%{transform:scaleY(1)}}
  @keyframes toastIn{from{transform:translate(-50%,-8px); opacity:0}to{transform:translate(-50%,0); opacity:1}}

  button, .block, .iconpick, .colorswatch{ transition: transform .12s ease, opacity .12s ease; }
  .block:active, .fab:active, .iconbtn:active, .txtbtn:active, .tabbar button:active,
  .sheet .row:active, .iconpick:active, .colorswatch:active,
  .btn-primary:active, .btn-secondary:active, .btn-danger:active, .miniplayer .ctrl button:active{ transform:scale(0.93); }
  .fab{ transition: transform .12s ease; }
  .fab:active{ transform:scale(0.88); }

  .navbar{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 8px;}
  .navbar .row{display:flex; align-items:center; justify-content:space-between;}
  .navbar h1{font-size:30px; font-weight:700; margin:0; letter-spacing:-0.02em;}
  .navbar .actions{display:flex; gap:14px; align-items:center;}
  .iconbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--label);background:none;border:none;cursor:pointer;padding:0;}
  .iconbtn svg{width:20px;height:20px;}
  .txtbtn{background:none;border:none;color:var(--accent);font-size:16px;font-weight:600;cursor:pointer;padding:0;font-family:var(--font);}

  .segmented{display:flex; background:var(--glass); border-radius:9px; padding:2px; margin:6px 20px 12px; font-size:13px;}
  .segmented button{flex:1; text-align:center; padding:6px 0; border-radius:7px; color:var(--label2); font-weight:500; background:none; border:none; font-family:var(--font); cursor:pointer;}
  .segmented button.active{background:var(--surface2); color:var(--label);}

  .searchfield{margin:4px 20px 12px; background:var(--glass); border-radius:10px; padding:9px 12px; display:flex; align-items:center; gap:8px;}
  .searchfield svg{width:16px;height:16px;color:var(--label3); flex-shrink:0;}
  .searchfield input{background:none;border:none;outline:none;color:var(--label);font-size:15px;width:100%;font-family:var(--font);}
  .searchfield input::placeholder{color:var(--label3);}

  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:170px; animation:fadeInUp .22s ease;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:4px 20px;}
  .empty{padding:60px 30px; text-align:center; color:var(--label3); font-size:14px; line-height:1.7; animation:fadeIn .3s ease;}

  .block{position:relative; border-radius:22px; padding:16px; height:148px; display:flex; flex-direction:column; justify-content:space-between;
    border:1px solid rgba(255,255,255,0.12); box-shadow:0 8px 20px rgba(0,0,0,0.25); cursor:pointer; user-select:none; touch-action:manipulation;
    animation:popIn .22s cubic-bezier(.2,.8,.2,1) backwards;}
  .block .glyph{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center; transition:transform .2s ease;}
  .block .glyph svg{width:18px;height:18px;color:#fff;}
  .block .name{font-size:15px;font-weight:600;line-height:1.25;color:#fff; word-break:break-all;}
  .block .len{font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px;}
  .block.playing{outline:2px solid #fff; outline-offset:-2px;}
  .block.playing .glyph{transform:scale(1.08);}
  .block.editing{animation:jiggle .26s infinite;}
  .block .delbadge{position:absolute; top:-6px; left:-6px; width:24px; height:24px; border-radius:50%; background:#8E8E93; border:2px solid #000;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; font-weight:700; z-index:2; animation:popIn .18s ease;}
  .block[draggable="true"]{cursor:grab;}
  .block.dragging{opacity:0.4;}
  @keyframes jiggle{0%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}100%{transform:rotate(-1deg)}}

  .wavebars{position:absolute; right:14px; bottom:14px; display:flex; align-items:flex-end; gap:2.5px; height:16px;}
  .wavebars i{display:block; width:2.5px; border-radius:2px; background:#fff; transform-origin:bottom; animation:wave 0.9s ease-in-out infinite;}
  .wavebars i:nth-child(1){height:7px; animation-delay:0s;}
  .wavebars i:nth-child(2){height:13px; animation-delay:.12s;}
  .wavebars i:nth-child(3){height:16px; animation-delay:.24s;}
  .wavebars i:nth-child(4){height:11px; animation-delay:.36s;}
  .wavebars i:nth-child(5){height:8px; animation-delay:.48s;}
  .wavebars.paused i{animation-play-state:paused; transform:scaleY(0.35);}

  .fab{position:absolute; right:20px; bottom:106px; width:58px; height:58px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(255,159,10,0.45); border:none; cursor:pointer; z-index:30;}
  .fab svg{width:26px;height:26px;color:#1a1a1a;}

</style>

<body>
<div id="app"></div>

<script>
/* ---------- IndexedDB ---------- */
const DB_NAME = "soundboard_db", DB_VER = 1;
let dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("sounds")) db.createObjectStore("sounds", { keyPath: "id" });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbp;
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("sounds", "readonly");
    const store = tx.objectStore("sounds");
    const req = store.getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(record){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("sounds", "readwrite");
    tx.objectStore("sounds").put(record);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("sounds", "readwrite");
    tx.objectStore("sounds").delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ---------- Icons ---------- */
const ICONS = {
  video: '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  mic: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  clap: '<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>',
  star: '<polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/>',
  alarm: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M5 3 2 6"/><path d="M22 6l-3-3"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  add: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  pause: '<rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/>',
  stop: '<rect x="5" y="5" width="14" height="14" rx="3"/>',
  home: '<path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/>',
  lib: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
};
function svg(name, extra){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${ICONS[name]||''}</svg>`; }
function svgFill(name, extra){ return `<svg viewBox="0 0 24 24" fill="currentColor" ${extra||''}>${ICONS[name]||''}</svg>`; }

const COLORS = [
  ["#FF9F0A","#D9480F"], ["#FF5E8A","#B9226B"], ["#32ADE6","#0A6BA8"],
  ["#30D158","#1B8A3A"], ["#BF5AF2","#7A28A8"], ["#8E8E93","#48484A"],
];
const ICON_CHOICES = ["video","mic","bell","clap","star","alarm","music"];

/* ---------- Built-in free sounds (synthesized, no external files) ---------- */
function synthBeep(freq=880, dur=0.35){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<data.length;i++){
    const t = i/ctx.sampleRate;
    data[i] = Math.sin(2*Math.PI*freq*t) * Math.exp(-t*6);
  }
  return { ctx, buf };
}
function synthClap(){
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const dur = 0.5;
  const buf = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0;i<data.length;i++){
    const t = i/ctx.sampleRate;
    const env = Math.exp(-t*10) * (Math.sin(t*90)>0?1:0.6);
    data[i] = (Math.random()*2-1) * env;
  }
  return { ctx, buf };
}
async function bufferToBlob(buf, ctx){
  const worker = new OfflineAudioContext(1, buf.length, buf.sampleRate);
  const src = worker.createBufferSource();
  src.buffer = buf; src.connect(worker.destination); src.start();
  const rendered = await worker.startRendering();
  const wavBytes = encodeWAV(rendered);
  return new Blob([wavBytes], { type: "audio/wav" });
}
function encodeWAV(buffer){
  const numCh = 1, sr = buffer.sampleRate, data = buffer.getChannelData(0);
  const bytesPerSample = 2, blockAlign = numCh*bytesPerSample;
  const dataSize = data.length*bytesPerSample;
  const bufArr = new ArrayBuffer(44+dataSize);
  const view = new DataView(bufArr);
  function ws(o,s){ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  ws(0,"RIFF"); view.setUint32(4,36+dataSize,true); ws(8,"WAVE"); ws(12,"fmt ");
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numCh,true);
  view.setUint32(24,sr,true); view.setUint32(28,sr*blockAlign,true); view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true); ws(36,"data"); view.setUint32(40,dataSize,true);
  let off = 44;
  for (let i=0;i<data.length;i++){ const s = Math.max(-1,Math.min(1,data[i])); view.setInt16(off, s<0?s*32768:s*32767, true); off+=2; }
  return bufArr;
}
async function makeFreeSoundBlob(kind){
  if (kind==="bell"){ const {ctx,buf} = synthBeep(1200,0.6); return bufferToBlob(buf,ctx); }
  if (kind==="alarm"){ const {ctx,buf} = synthBeep(660,0.9); return bufferToBlob(buf,ctx); }
  if (kind==="clap"){ const {ctx,buf} = synthClap(); return bufferToBlob(buf,ctx); }
  const {ctx,buf} = synthBeep(880,0.4); return bufferToBlob(buf,ctx);
}
const FREE_SOUNDS = [
  { key:"bell", title:"ベル", icon:"bell" },
  { key:"clap", title:"拍手", icon:"clap" },
  { key:"alarm", title:"アラーム", icon:"alarm" },
];

/* ---------- App state ---------- */
let sounds = [];
let tab = "home";
let editMode = false;
let searchQuery = "";
let currentEl = null;
let currentPlayingId = null;
let currentUrl = null;
let editingSound = null;
let dragSrcId = null;

function uid(){ return "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function cleanupCurrentEl(){
  if (currentEl){
    try{ currentEl.pause(); currentEl.currentTime = 0; }catch(e){}
    currentEl.remove();
  }
  if (currentUrl){ URL.revokeObjectURL(currentUrl); }
  currentEl = null; currentUrl = null;
}

function stopPlayback(){
  cleanupCurrentEl();
  currentPlayingId = null;
  render();
}

function playSound(s){
  cleanupCurrentEl();
  const url = URL.createObjectURL(s.blob);
  let el;
  if (s.kind === "video"){
    el = document.createElement("video");
    el.style.display = "none"; el.playsInline = true;
  } else {
    el = document.createElement("audio");
  }
  el.src = url;
  el.addEventListener("ended", () => { if (currentPlayingId===s.id) stopPlayback(); });
  document.body.appendChild(el);
  el.play().catch(()=>{});
  currentEl = el; currentUrl = url; currentPlayingId = s.id;
  render();
}

function togglePlayPause(){
  if (!currentEl) return;
  if (currentEl.paused) currentEl.play().catch(()=>{}); else currentEl.pause();
  render();
}

/* ---------- Rendering ---------- */
const app = document.getElementById("app");

function fmtLen(sec){
  if (!sec || !isFinite(sec)) return "--:--";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

function render(){
  const filtered = tab === "library"
    ? sounds.filter(s => s.title.toLowerCase().includes(searchQuery.toLowerCase()))
    : sounds;
  const ordered = [...filtered].sort((a,b)=>a.order-b.order);

  let html = "";
  html += `<div class="navbar">
    <div class="row">
      <h1>${tab==="home" ? "サウンドボード" : "ライブラリ"}</h1>
      <div class="actions">
        ${tab==="home" ? `<button class="txtbtn" onclick="toggleEdit()">${editMode?"完了":"編集"}</button>` : ""}
      </div>
    </div>
  </div>`;

  if (tab === "library"){
    html += `<div class="searchfield">${svg("search")}<input id="searchInput" placeholder="検索" value="${escapeAttr(searchQuery)}" oninput="onSearch(this.value)"></div>`;
  }

  html += `<div class="scroll" id="scrollArea">`;
  if (tab === "freesounds"){
    html += renderFreeSounds();
  } else if (ordered.length === 0){
    html += `<div class="empty">${tab==="library" ? "音声がまだありません。" : "＋ボタンから、動画や音声を追加しましょう。"}</div>`;
  } else {
    html += `<div class="grid" id="grid">`;
    ordered.forEach((s,i) => { html += renderBlock(s, i); });
    html += `</div>`;
  }
  html += `</div>`;

  if (currentEl){
    const s = sounds.find(x=>x.id===currentPlayingId);
    const paused = currentEl.paused;
    html += `<div class="miniplayer"><div class="inner">
      <div class="art" style="background:linear-gradient(155deg, ${s?.color?.[0]||'#888'}, ${s?.color?.[1]||'#444'});">
        <div class="wavebars mini ${paused?'paused':''}"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="info"><div class="t">${escapeHtml(s?.title||"再生中")}</div><div class="s">${paused?"一時停止中":"再生中"}</div></div>
      <div class="ctrl">
        <button onclick="togglePlayPause()">${paused ? svgFill("play") : svgFill("pause")}</button>
        <button class="stop" onclick="stopPlayback()" aria-label="即停止">${svgFill("stop")}</button>
      </div>
    </div></div>`;
  }

  if (tab === "home"){
    html += `<button class="fab" onclick="openAddSheet()">${svg("add")}</button>`;
  }

  html += `<div class="tabbar">
    <button class="${tab==='home'?'active':''}" onclick="setTab('home')">${svg('home')}ホーム</button>
    <button class="${tab==='library'?'active':''}" onclick="setTab('library')">${svg('lib')}ライブラリ</button>
    <button class="${tab==='freesounds'?'active':''}" onclick="setTab('freesounds')">${svg('bell')}フリー音声</button>
  </div>`;

  app.innerHTML = html;
  attachDnD();
}

function renderBlock(s, i){
  const playing = currentPlayingId === s.id;
  const paused = playing && currentEl && currentEl.paused;
  const delay = Math.min(i, 9) * 25;
  return `<div class="block ${editMode?'editing':''} ${playing?'playing':''}" style="background:linear-gradient(155deg, ${s.color[0]}, ${s.color[1]}); animation-delay:${delay}ms;"
      data-id="${s.id}" ${editMode?'draggable="true"':''}
      onclick="${editMode ? `openEditSheet('${s.id}')` : `playSound(sounds.find(x=>x.id==='${s.id}'))`}">
    ${editMode ? `<div class="delbadge" onclick="event.stopPropagation(); deleteSound('${s.id}')">−</div>` : ""}
    <div class="glyph">${svg(s.icon)}</div>
    <div><div class="name">${escapeHtml(s.title)}</div><div class="len">${fmtLen(s.duration)}</div></div>
    ${playing ? `<div class="wavebars ${paused?'paused':''}"><i></i><i></i><i></i><i></i><i></i></div>` : ""}
  </div>`;
}

function renderFreeSounds(){
  let html = `<div style="padding:8px 20px 4px; font-size:13px; color:var(--label3);">タップでホームに追加できます</div><div class="grid">`;
  FREE_SOUNDS.forEach(f => {
    const already = sounds.some(s => s.freeKey === f.key);
    html += `<div class="block" style="background:linear-gradient(155deg,#3A3A3C,#1C1C1E);" onclick="addFreeSound('${f.key}')">
      <div class="glyph">${svg(f.icon)}</div>
      <div><div class="name">${f.title}</div><div class="len">${already ? "追加済み" : "無料"}</div></div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ---------- Actions ---------- */
function setTab(t){ tab = t; editMode = false; render(); }
function toggleEdit(){ editMode = !editMode; render(); }
function onSearch(v){ searchQuery = v; render(); const el=document.getElementById('searchInput'); if(el){ el.focus(); el.setSelectionRange(v.length, v.length);} }

async function deleteSound(id){
  if (currentPlayingId === id) stopPlayback();
  sounds = sounds.filter(s => s.id !== id);
  await dbDelete(id);
  render();
}

/* Drag reorder (desktop + touch-capable via HTML5 DnD) */
function attachDnD(){
  const grid = document.getElementById("grid");
  if (!grid || !editMode) return;
  grid.querySelectorAll(".block").forEach(el => {
    el.addEventListener("dragstart", e => { dragSrcId = el.dataset.id; el.classList.add("dragging"); });
    el.addEventListener("dragend", e => { el.classList.remove("dragging"); });
    el.addEventListener("dragover", e => { e.preventDefault(); });
    el.addEventListener("drop", e => {
      e.preventDefault();
      const targetId = el.dataset.id;
      if (!dragSrcId || dragSrcId === targetId) return;
      const srcIdx = sounds.findIndex(s=>s.id===dragSrcId);
      const tgtIdx = sounds.findIndex(s=>s.id===targetId);
      const ordered = [...sounds].sort((a,b)=>a.order-b.order);
      const oi = ordered.findIndex(s=>s.id===dragSrcId), ti = ordered.findIndex(s=>s.id===targetId);
      const [moved] = ordered.splice(oi,1);
      ordered.splice(ti,0,moved);
      ordered.forEach((s,i)=>{ s.order = i; });
      sounds = ordered;
      sounds.forEach(s => dbPut(s));
      render();
    });
  });
}

/* ---------- Add flow ---------- */
let addState = {};
function openAddSheet(){
  addState = { step: "source" };
  renderSheet();
}
function closeSheet(){
  document.getElementById("sheetHost")?.remove();
}
function renderSheet(){
  closeSheet();
  const host = document.createElement("div");
  host.id = "sheetHost";
  host.className = "sheet-backdrop";
  host.onclick = (e) => { if (e.target === host) closeSheet(); };
  let inner = "";

  if (addState.step === "source"){
    inner = `<div class="sheet" onclick="event.stopPropagation()">
      <div class="grabber"></div>
      <h3>音声を追加</h3>
      <div class="sub">ソースを選択</div>
      <button class="row" onclick="pickFile('video')"><div class="ic" style="background:#FF9F0A;">${svg('video')}</div><div class="label">動画を選択</div><div class="chev">${svg('chev')}</div></button>
      <button class="row" onclick="pickFile('audio')"><div class="ic" style="background:#32ADE6;">${svg('mic')}</div><div class="label">音声ファイルを追加</div><div class="chev">${svg('chev')}</div></button>
    </div>
    <input type="file" id="fileInput" accept="">`;
  } else if (addState.step === "details"){
    inner = `<div class="sheet" onclick="event.stopPropagation()">
      <div class="grabber"></div>
      <h3>詳細を入力</h3>
      <div class="sub">タイトル・アイコン・カラーを設定</div>
      <div class="field"><label>タイトル</label><input type="text" id="titleInput" value="${escapeAttr(addState.title)}" oninput="addState.title=this.value"></div>
      <div style="font-size:12px;color:var(--label3);margin-bottom:8px;">アイコン</div>
      <div class="iconrow">${ICON_CHOICES.map(ic => `<button class="iconpick ${addState.icon===ic?'selected':''}" onclick="addState.icon='${ic}'; renderSheet();">${svg(ic)}</button>`).join("")}</div>
      <div style="font-size:12px;color:var(--label3);margin-bottom:8px;">カラー</div>
      <div class="swatchrow">${COLORS.map((c,i) => `<button class="colorswatch ${addState.colorIdx===i?'selected':''}" style="background:linear-gradient(155deg,${c[0]},${c[1]});" onclick="addState.colorIdx=${i}; renderSheet();"></button>`).join("")}</div>
      <button class="btn-primary" onclick="saveNewSound()">保存</button>
      <button class="btn-secondary" onclick="closeSheet()">キャンセル</button>
    </div>`;
  }
  host.innerHTML = inner;
  document.body.appendChild(host);

  if (addState.step === "source"){
    const fi = document.getElementById("fileInput");
    fi.onchange = onFilePicked;
  }
}
function pickFile(kind){
  addState.pendingKind = kind;
  const fi = document.getElementById("fileInput");
  fi.accept = kind === "video" ? "video/*" : "audio/*";
  fi.click();
}
function onFilePicked(e){
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const probe = document.createElement(addState.pendingKind === "video" ? "video" : "audio");
  probe.preload = "metadata";
  probe.style.position = "fixed";
  probe.style.width = "1px"; probe.style.height = "1px"; probe.style.opacity = "0"; probe.style.pointerEvents = "none";
  document.body.appendChild(probe);
  probe.src = url;
  const finish = (duration) => {
    addState.blob = file;
    addState.kind = addState.pendingKind;
    addState.duration = duration;
    addState.title = file.name.replace(/\.[^.]+$/, "").slice(0,40);
    addState.icon = addState.pendingKind === "video" ? "video" : "mic";
    addState.colorIdx = Math.floor(Math.random()*COLORS.length);
    addState.step = "details";
    URL.revokeObjectURL(url);
    probe.remove();
    renderSheet();
  };
  probe.onloadedmetadata = () => finish(isFinite(probe.duration) ? probe.duration : 0);
  probe.onerror = () => finish(0);
}
async function saveNewSound(){
  if (!addState.title || !addState.title.trim()) { addState.title = "名称未設定"; }
  const rec = {
    id: uid(), title: addState.title.trim(), icon: addState.icon, color: COLORS[addState.colorIdx],
    kind: addState.kind, blob: addState.blob, duration: addState.duration || 0,
    order: sounds.length, createdAt: Date.now(),
  };
  await dbPut(rec);
  sounds.push(rec);
  closeSheet();
  render();
  showToast("保存しました");
}
async function addFreeSound(key){
  if (sounds.some(s => s.freeKey === key)) { showToast("すでに追加されています"); return; }
  const f = FREE_SOUNDS.find(x=>x.key===key);
  const blob = await makeFreeSoundBlob(key);
  const rec = {
    id: uid(), title: f.title, icon: f.icon, color: COLORS[Math.floor(Math.random()*COLORS.length)],
    kind: "audio", blob, duration: 0.6, order: sounds.length, createdAt: Date.now(), freeKey: key,
  };
  await dbPut(rec);
  sounds.push(rec);
  render();
  showToast("ホームに追加しました");
}

/* ---------- Edit sheet ---------- */
function openEditSheet(id){
  const s = sounds.find(x=>x.id===id);
  if (!s) return;
  editingSound = { ...s };
  renderEditSheet();
}
function renderEditSheet(){
  const host = document.createElement("div");
  host.id = "editSheetHost";
  host.className = "sheet-backdrop";
  host.onclick = (e) => { if (e.target === host) closeEditSheet(); };
  host.innerHTML = `<div class="sheet" onclick="event.stopPropagation()">
    <div class="grabber"></div>
    <h3>${escapeHtml(editingSound.title)}</h3>
    <div class="sub">名前・アイコン・色を編集</div>
    <div class="field"><label>名前</label><input type="text" id="editTitleInput" value="${escapeAttr(editingSound.title)}" oninput="editingSound.title=this.value"></div>
    <div style="font-size:12px;color:var(--label3);margin-bottom:8px;">アイコン</div>
    <div class="iconrow">${ICON_CHOICES.map(ic => `<button class="iconpick ${editingSound.icon===ic?'selected':''}" onclick="editingSound.icon='${ic}'; renderEditSheet();">${svg(ic)}</button>`).join("")}</div>
    <div style="font-size:12px;color:var(--label3);margin-bottom:8px;">カラー</div>
    <div class="swatchrow">${COLORS.map((c,i) => `<button class="colorswatch ${editingSound.color[0]===c[0]?'selected':''}" style="background:linear-gradient(155deg,${c[0]},${c[1]});" onclick="editingSound.color=${JSON.stringify(c)}; renderEditSheet();"></button>`).join("")}</div>
    <button class="btn-primary" onclick="saveEditSound()">完了</button>
    <button class="btn-danger" onclick="deleteFromEdit()">このサウンドを削除</button>
  </div>`;
  document.getElementById("editSheetHost")?.remove();
  document.body.appendChild(host);
}
function closeEditSheet(){ document.getElementById("editSheetHost")?.remove(); editingSound = null; }
async function saveEditSound(){
  const idx = sounds.findIndex(s=>s.id===editingSound.id);
  if (idx>-1){
    sounds[idx] = { ...sounds[idx], title: editingSound.title.trim() || "名称未設定", icon: editingSound.icon, color: editingSound.color };
    await dbPut(sounds[idx]);
  }
  closeEditSheet();
  render();
}
async function deleteFromEdit(){
  const id = editingSound.id;
  closeEditSheet();
  await deleteSound(id);
}

/* ---------- Toast ---------- */
function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1600);
}

function _debugState(){ return { sounds, editMode, currentPlayingId, tab }; }

/* ---------- Init ---------- */
async function init(){
  sounds = await dbGetAll();
  render();
}
init();
</script>
